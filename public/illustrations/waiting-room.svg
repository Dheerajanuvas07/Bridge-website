<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">Illustration: a Bridge Captain sitting with an older woman in a clinic waiting room</title>
  <rect width="800" height="600" fill="#F2EEE6"/>
  <rect y="450" width="800" height="150" fill="#E4DDD0"/>
  <!-- window -->
  <rect x="470" y="90" width="250" height="190" rx="4" fill="#E5EDE8" stroke="#FFFFFF" stroke-width="10"/>
  <line x1="595" y1="90" x2="595" y2="280" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="530" cy="250" r="34" fill="#9DB8AA"/><circle cx="660" cy="245" r="40" fill="#6E9483"/>
  <!-- clock -->
  <circle cx="200" cy="140" r="38" fill="#FFFFFF" stroke="#2D5A4A" stroke-width="6"/>
  <path d="M200 140 v-22 M200 140 h16" stroke="#1C1B19" stroke-width="5" stroke-linecap="round"/>
  <!-- plant -->
  <rect x="700" y="400" width="54" height="56" rx="6" fill="#B98A5E"/>
  <path d="M727 400 q-40 -60 -18 -110 M727 400 q8 -70 40 -96 M727 400 q-6 -50 -50 -70" stroke="#3F7461" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- chairs -->
  <g fill="#2D5A4A">
    <rect x="150" y="330" width="120" height="100" rx="12"/><rect x="290" y="330" width="120" height="100" rx="12"/><rect x="430" y="330" width="120" height="100" rx="12"/>
    <rect x="140" y="410" width="420" height="30" rx="8"/>
  </g>
  <g fill="#21453A"><rect x="160" y="440" width="12" height="40"/><rect x="530" y="440" width="12" height="40"/></g>
  <!-- Captain (seated, left) -->
  <g>
    <rect x="218" y="380" width="96" height="30" rx="14" fill="#2F3337"/>
    <rect x="292" y="392" width="24" height="88" rx="9" fill="#2F3337"/>
    <rect x="288" y="472" width="38" height="12" rx="6" fill="#1C1B19"/>
    <rect x="200" y="270" width="66" height="128" rx="24" fill="#3F7461"/>
    <path d="M258 300 q30 40 64 50" stroke="#3F7461" stroke-width="18" stroke-linecap="round" fill="none"/>
    <circle cx="234" cy="238" r="28" fill="#8D5B3E"/>
    <path d="M205 238 q0 -36 30 -34 q30 2 28 32 q-14 -16 -30 -14 q-16 2 -28 16z" fill="#1F1814"/>
  </g>
  <!-- older adult (seated, right) -->
  <g>
    <rect x="356" y="380" width="96" height="30" rx="14" fill="#6B6458"/>
    <rect x="430" y="392" width="24" height="88" rx="9" fill="#6B6458"/>
    <rect x="426" y="472" width="38" height="12" rx="6" fill="#3A2E25"/>
    <rect x="338" y="272" width="66" height="126" rx="24" fill="#C9A27E"/>
    <path d="M344 300 q-14 40 -18 50" stroke="#C9A27E" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="372" cy="240" r="27" fill="#E8C4A6"/>
    <path d="M343 246 q-4 -40 30 -40 q32 0 28 40 q-6 -24 -28 -24 q-22 0 -30 24z" fill="#E4E1DB"/>
    <circle cx="390" cy="212" r="12" fill="#E4E1DB"/>
    <rect x="404" y="330" width="34" height="44" rx="4" fill="#FFFFFF" stroke="#DDD7CC" stroke-width="3"/>
  </g>
</svg>
